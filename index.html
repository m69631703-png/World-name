const normalize=s=>s.toLowerCase().trim().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[‏‎]/g,'').replace(/\s+/g,' ');
const aliasMap={};Object.entries(aliases).forEach(([english,arr])=>arr.forEach(a=>aliasMap[normalize(a)]=english));
let found=new Set(),running=false,remaining=900,interval=null,paths={};
const input=document.getElementById('answer'),msg=document.getElementById('msg');
function update(){document.getElementById('count').textContent=found.size;document.getElementById('pct').textContent=Math.round(found.size/195*100)+'%';document.getElementById('found').innerHTML=[...found].map(x=>'<span class="pill">'+aliases[x][0]+'</span>').join('');}
function clock(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent=m+':'+String(s).padStart(2,'0');}
function start(){if(running)return;running=true;msg.textContent='ابدأ الكتابة!';input.focus();interval=setInterval(()=>{remaining--;clock();if(remaining<=0){stop();msg.textContent='انتهى الوقت! نتيجتك '+found.size+' من 195.';}},1000);}
function stop(){running=false;clearInterval(interval);}
function submit(){let value=normalize(input.value);if(!value)return;let key=aliasMap[value];if(key&& !found.has(key)){found.add(key);let p=paths[key];if(p)p.classList.add('found');msg.textContent='ممتاز! '+aliases[key][0];input.value='';update();if(found.size>=195){stop();msg.textContent='🎉 أتممت جميع الدول!';}}else if(key&&found.has(key)){msg.textContent='هذه الدولة محسوبة مسبقًا.';}else{msg.textContent='لم أتعرف على الاسم — جرّب اسمًا آخر أو تهجئة مختلفة.';}}
