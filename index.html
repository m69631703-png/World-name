<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسمية دول العالم بالعربي | تحدي أسماء الدول</title>
<meta name="description" content="اختبر ذاكرتك في تحدي تسمية دول العالم بالعربي. اكتب أسماء 195 دولة على خريطة العالم خلال 15 دقيقة.">
<meta name="keywords" content="تسمية دول العالم بالعربي, أسماء الدول بالعربي, تحدي الدول, خريطة العالم">
<meta name="robots" content="index,follow">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#e5eaf4;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:18px}
.wrap{max-width:900px;margin:auto}
h1{text-align:center;font-size:clamp(25px,5vw,36px);margin:12px 0}
p{text-align:center;color:#aebbd0;font-size:18px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}
.stat{background:#192338;border:1px solid #2c3a56;border-radius:20px;padding:16px 22px;font-size:20px}
.stat b{font-size:26px}
.panel{background:#141e31;border:1px solid #2c3a56;border-radius:25px;padding:18px}
.inputs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.inputs input{flex:1;min-width:220px;background:#0b1120;color:#fff;border:2px solid #34435f;border-radius:20px;padding:16px;font-size:20px;text-align:center}
.btn{border:0;border-radius:18px;padding:16px 24px;font-size:20px;font-weight:700;background:#72a5f4;color:#071225;cursor:pointer}
.btn.secondary{background:#2a3852;color:#eef4ff}
.hint{text-align:center;margin:18px;color:#aebbd0}
.mapbox{background:#0b1120;border-radius:22px;overflow:hidden;margin-top:20px;min-height:300px;position:relative}
.mapbox svg{width:100%;height:auto;display:block;overflow:hidden}
.country{fill:#293953;stroke:#172238;stroke-width:.6;transition:fill .2s}
.country.found{fill:#72a5f4}
.country:hover{fill:#496789}
.list{margin-top:16px;background:#0b1120;border-radius:18px;padding:14px;max-height:200px;overflow:auto;color:#d7e2f3}
.list h3{margin:0 0 10px}
.listitems{display:flex;gap:7px;flex-wrap:wrap}
.pill{background:#1c2940;padding:6px 10px;border-radius:12px;font-size:14px}
.msg{text-align:center;min-height:26px;color:#9bc2ff;margin:10px}
.suggest{background:#23334d;padding:12px;border-radius:14px;text-align:center;display:none;margin:8px 0}
.suggest button{margin:8px}
.foot{text-align:center;color:#78869d;font-size:13px;margin:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>🌍 تسمية دول العالم بالعربي</h1>
<p>اكتب أسماء الدول بالعربية من ذاكرتك — كل دولة صحيحة تُلوّن على الخريطة</p>

<div class="stats">
<div class="stat">الدول <b id="count">0</b> / <b id="total">195</b></div>
<div class="stat">الوقت <b id="timer">15:00</b></div>
<div class="stat">النسبة <b id="pct">0%</b></div>
</div>

<div class="panel">
<div class="inputs">
<input id="answer" autocomplete="off" placeholder="اكتب اسم دولة..." aria-label="اسم الدولة">
<button class="btn" id="start">ابدأ</button>
</div>

<div class="suggest" id="suggest"></div>

<div class="inputs" style="margin-top:12px">
<button class="btn secondary" id="show">عرض الإجابات</button>
<button class="btn secondary" id="reset">إعادة</button>
</div>

<div class="msg" id="msg"></div>
<div class="hint" id="hint">اضغط ابدأ لبدء تحدي الـ 15 دقيقة.</div>
<div class="mapbox" id="map"></div>

<div class="list">
<h3>الدول المكتشفة</h3>
<div class="listitems" id="listitems">—</div>
</div>
</div>
<div class="foot">قد يتطلب تحميل الخريطة اتصالاً بالإنترنت.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

"United Kingdom":["بريطانيا","المملكة المتحدة","انجلترا","إنجلترا","ويلز","وِيلز"],
"United States of America":["أمريكا","الولايات المتحدة","الولايات المتحدة الأمريكية"],
"Uruguay":["أوروغواي","الأوروغواي","اورغواي","الأورغواي","الاورغواي","أورغواي"],
"Uzbekistan":["أوزبكستان"],
"Vanuatu":["فانواتو"],
"Vatican":["الفاتيكان"],
"Venezuela":["فنزويلا"],
"Vietnam":["فيتنام"],

"Zimbabwe":["زيمبابوي"]
};

const mapNames={
"Czechia":"Czech Republic",
"Democratic Republic of the Congo":"Dem. Rep. Congo",
"Republic of the Congo":"Congo",
"South Sudan":"South Sudan",
"North Korea":"North Korea",
"South Korea":"South Korea",
"Eswatini":"eSwatini",
"United States of America":"United States of America",
"Vatican":"Vatican",
"Palestine":"Palestine",
"Taiwan":"Taiwan"
};

const norm=s=>s.toLowerCase().trim()
.replace(/[أإآ]/g,"ا")
.replace(/ى/g,"ي")
.replace(/[ًٌٍَُِّْ]/g,"")
.replace(/[ـ]/g,"")
.replace(/\s+/g," ");

let aliasMap={},found=new Set(),running=false,remaining=900,timerInt=null,features=[];

for(const [k,arr] of Object.entries(aliases)){
aliasMap[norm(k)]=k;
arr.forEach(a=>aliasMap[norm(a)]=k);
}

const input=document.getElementById('answer');
const msg=document.getElementById('msg');
const suggest=document.getElementById('suggest');

function update(){
document.getElementById('count').textContent=found.size;
document.getElementById('pct').textContent=Math.round(found.size/195*100)+'%';
document.getElementById('listitems').innerHTML=found.size?[...found].map(x=>`<span class="pill">${aliases[x]?.[0]||x}</span>`).join(''):'—';
}

function clock(){
let m=Math.floor(remaining/60),s=remaining%60;
document.getElementById('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
if(remaining<=0){stop();msg.textContent='انتهى الوقت!';showAnswers()}
}

function start(){
if(running)return;
running=true;
document.getElementById('hint').textContent='اكتب أسماء الدول، واضغط Enter لإرسال الإجابة.';
timerInt=setInterval(()=>{remaining--;clock()},1000);
input.focus();
}

function stop(){
running=false;
clearInterval(timerInt);
}

function reset(){
stop();
remaining=900;
found.clear();
clock();
update();
input.value='';
msg.textContent='';
suggest.style.display='none';
document.querySelectorAll('.country.found').forEach(p=>p.classList.remove('found'));
document.getElementById('hint').textContent='اضغط ابدأ لبدء تحدي الـ 15 دقيقة.';
}

function submit(){
if(!running)start();
let v=norm(input.value);
if(!v)return;
let key=aliasMap[v];

if(key&&!found.has(key)){
found.add(key);
let featureName=mapNames[key]||key;
let p=document.querySelector(`[data-name="${CSS.escape(featureName)}"]`);
if(!p)p=document.querySelector(`[data-name="${CSS.escape(key)}"]`);
if(p)p.classList.add('found');
msg.textContent='صحيح! 🎉';
msg.style.color='#9bc2ff';
input.value='';
suggest.style.display='none';
update();
if(found.size>=195){stop();msg.textContent='مذهل! أكملت جميع الدول!'}
}
else if(key&&found.has(key)){
msg.textContent='هذه الدولة سبق أن كتبتها.';
suggest.style.display='none';
}
else{
let candidate=Object.keys(aliasMap).find(a=>a.length>2&&(a.includes(v)||v.includes(a)));
if(candidate){
let c=aliasMap[candidate];
suggest.innerHTML=`هل تقصد <b>${aliases[c]?.[0]||c}</b>؟ <button class="btn" id="yes">نعم</button> <button class="btn secondary" id="no">لا</button>`;
suggest.style.display='block';
document.getElementById('yes').onclick=()=>{input.value=aliases[c]?.[0]||c;submit()};
document.getElementById('no').onclick=()=>{suggest.style.display='none';msg.textContent='حاول مرة أخرى.'};
}
else{
msg.textContent='لم أتعرف على الدولة، حاول كتابة الاسم بشكل مختلف.';
suggest.style.display='none';
}
}
input.focus();
}

function showAnswers(){
stop();
msg.textContent='الدول التي لم تكتشفها تظهر بأسمائها هنا:';
document.getElementById('listitems').innerHTML=Object.keys(aliases).map(k=>`<span class="pill" style="opacity:${found.has(k)?'.5':'1'}">${aliases[k][0]}${found.has(k)?' ✓':''}</span>`).join('');
}

document.getElementById('start').onclick=start;
document.getElementById('reset').onclick=reset;
document.getElementById('show').onclick=showAnswers;
input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
clock();
update();

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
.then(r=>r.json())
.then(world=>{
features=topojson.feature(world,world.objects.countries).features;
const width=960,height=520;
const svg=d3.select('#map').append('svg')
.attr('viewBox',`0 0 ${width} ${height}`)
.attr('preserveAspectRatio','xMidYMid meet');
const projection=d3.geoNaturalEarth1()
.fitExtent([[8,8],[width-8,height-8]],{type:'FeatureCollection',features});
const path=d3.geoPath(projection);
svg.append('g').selectAll('path')
.data(features).join('path')
.attr('class','country')
.attr('data-name',d=>d.properties.name)
.attr('d',path)
.append('title').text(d=>d.properties.name);
})
.catch(()=>{
document.getElementById('map').innerHTML='<p>تعذر تحميل الخريطة. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</p>';
});
</script>
