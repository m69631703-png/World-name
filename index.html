<meta name="keywords" content="تسمية دول العالم بالعربي, لعبة الدول, خريطة العالم, تحدي جغرافيا, أسماء الدول">

*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#f1f5f9;font-family:Arial,sans-serif}
header{text-align:center;padding:18px 10px}
h1{margin:5px;font-size:25px}
.subtitle{color:#94a3b8;font-size:14px}
.container{max-width:1100px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#172033;border-radius:12px;padding:12px;text-align:center}
.stat div{font-size:12px;color:#94a3b8}
.stat strong{display:block;font-size:23px;margin-top:5px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{flex:1;min-width:170px;padding:14px;border-radius:10px;border:1px solid #334155;background:#172033;color:white;font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
button.secondary{background:#334155}
button.danger{background:#b91c1c}
#map{background:#111c2e;border-radius:15px;width:100%;height:500px;overflow:hidden}
svg{width:100%;height:100%}
.country{fill:#334155;stroke:#0b1220;stroke-width:.6;transition:fill .2s}
.country.found{fill:#22c55e}
.country:hover{fill:#64748b}
.country.found:hover{fill:#16a34a}
.bottom{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.panel{background:#172033;padding:14px;border-radius:12px;flex:1;min-width:220px}
.panel h3{margin-top:0}
#foundList{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:#26354b;padding:6px 9px;border-radius:8px;font-size:13px}
.message{min-height:25px;margin:10px 0;font-weight:bold}
.success{color:#4ade80}
.error{color:#f87171}
#hint{color:#fbbf24}
@media(max-width:600px){
.stats{grid-template-columns:repeat(2,1fr)}
#map{height:380px}
h1{font-size:20px}
}
</style>

function norm(s){
return s.toLowerCase()
.replace(/[أإآ]/g,"ا")
.replace(/ؤ/g,"و")
.replace(/ئ/g,"ي")
.replace(/ى/g,"ي")
.replace(/ة/g,"ه")
.replace(/ـ/g,"")
.replace(/[^\u0600-\u06FFa-z0-9]/g,"")
.trim();
}

const allNames={};
countries.forEach(c=>{
allNames[c]=[c,...(aliases[c]||[])];
});

let found=new Set();
let seconds=900;
let paused=false;
let streak=0;
let gameOver=false;
let projection,path,svg;
const message=document.getElementById("message");
const input=document.getElementById("answer");

function update(){
document.getElementById("score").textContent=found.size+" / 195";
document.getElementById("percent").textContent=Math.round(found.size/195*100)+"%";
document.getElementById("streak").textContent=streak;
document.getElementById("timer").textContent=
Math.floor(seconds/60).toString().padStart(2,"0")+":"+
(seconds%60).toString().padStart(2,"0");
document.getElementById("foundList").innerHTML=
[...found].sort((a,b)=>a.localeCompare(b)).map(c=>'<span class="tag">'+aliases[c]?.[0]||c+'</span>').join("");
}

function checkAnswer(){
if(gameOver||paused)return;
let raw=input.value.trim();
if(!raw)return;
let n=norm(raw);
let matched=null;
for(const c of countries){
if(found.has(c))continue;
if((allNames[c]||[]).some(a=>norm(a)===n)){
matched=c;break;
}
}
if(matched){
found.add(matched);
streak++;
message.textContent="✔ إجابة صحيحة: "+(aliases[matched]?.[0]||matched);
message.className="message success";
document.querySelectorAll('[data-country="'+matched+'"]').forEach(el=>el.classList.add("found"));
if(streak===5)message.textContent+=" 🔥 خمس إجابات متتالية!";
if(found.size===195){gameOver=true;message.textContent="🎉 مذهل! اكتشفت جميع الدول!";clearInterval(timerInterval);}
}else{
streak=0;
let close=null;
for(const c of countries){
if(found.has(c))continue;
if((allNames[c]||[]).some(a=>norm(a).includes(n)||n.includes(norm(a))&&n.length>3)){
close=c;break;
}
}
if(close){
message.textContent="❌ غير مطابقة تمامًا. هل تقصد "+(aliases[close]?.[0]||close)+"؟";
}else{
message.textContent="❌ لم نتعرف على الاسم، حاول مرة أخرى.";
}
message.className="message error";
}
input.value="";
update();
input.focus();
}

document.getElementById("submit").onclick=checkAnswer;
input.addEventListener("keydown",e=>{if(e.key==="Enter")checkAnswer()});

document.getElementById("hintBtn").onclick=()=>{
if(gameOver)return;
let remaining=countries.filter(c=>!found.has(c));
if(!remaining.length)return;
let c=remaining[Math.floor(Math.random()*remaining.length)];
document.getElementById("hint").textContent="💡 تلميح: "+(aliases[c]?.[0]||c).slice(0,2)+"...";
};

document.getElementById("pause").onclick=()=>{
paused=!paused;
document.getElementById("pause").textContent=paused?"استئناف":"إيقاف مؤقت";
message.textContent=paused?"⏸ اللعبة متوقفة":"▶ اللعبة مستمرة";
};

document.getElementById("reset").onclick=()=>{
if(!confirm("هل تريد إعادة اللعبة من البداية؟"))return;
found.clear();seconds=900;paused=false;streak=0;gameOver=false;
document.getElementById("pause").textContent="إيقاف مؤقت";
document.getElementById("hint").textContent="";
message.textContent="";
document.querySelectorAll(".country").forEach(el=>el.classList.remove("found"));
update();
};

document.getElementById("showAnswers").onclick=()=>{
if(!confirm("هل تريد عرض جميع الدول المتبقية؟"))return;
gameOver=true;
clearInterval(timerInterval);
let remaining=countries.filter(c=>!found.has(c)).map(c=>aliases[c]?.[0]||c);
message.textContent="الدول المتبقية: "+remaining.join("، ");
};

let timerInterval=setInterval(()=>{
if(paused||gameOver)return;
seconds--;
if(seconds<=0){
seconds=0;gameOver=true;
message.textContent="انتهى الوقت! اكتشفت "+found.size+" من 195 دولة.";
}
update();
},1000);

update();
